name: Daily Puzzle

on:
  schedule:
    # 14:23 UTC is late afternoon in Berlin, chosen over the previous 19:00 UTC
    # so a queued run still has most of the day to start. GitHub cron has no
    # timezone, so this is 16:23 local in summer and 15:23 in winter.
    #
    # The minute is deliberately not :00. GitHub queues scheduled workflows and
    # runs them when capacity allows, and the top of the hour is the busiest
    # slot on the platform, so an on-the-hour job absorbs the worst of the delay.
    - cron: '23 14 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: "Which day to solve: 1 for tomorrow (the daily default), 0 for today"
        required: false
        default: '1'
        type: choice
        options:
          - '1'
          - '0'

# A scheduled run and a hand-triggered one must not race over the same output.
concurrency:
  group: daily-puzzle
  cancel-in-progress: false

jobs:
  solve-and-send:
    runs-on: ubuntu-latest
    env:
      # Scheduled runs carry no inputs, so the fallback is what makes the daily
      # job keep solving tomorrow.
      DAYS: ${{ github.event.inputs.days || '1' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Build
        run: |
          go build -v -o main ./pcalendar/main.go
          go build -v -o date-tool ./cmd/date-tool/main.go

      - name: Create output directory jalali
        run: mkdir jalali

      - name: Create output directory gregorian
        run: mkdir gregorian


      - name: Generate Solutions (Gregorian)
        run: ./main -relative -days "$DAYS" -png -count 5 -output-dir gregorian

      - name: Generate Solutions (Jalali)
        run: ./main -relative -days "$DAYS" -png -jalali -count 5 -output-dir jalali


      - name: Get Date
        id: date
        run: ./date-tool -days "$DAYS" >> $GITHUB_OUTPUT

      - name: Send Gregorian to Telegram
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            Daily Pentomino Puzzle Solutions (Gregorian) (${{ steps.date.outputs.today }})
          photo: gregorian/1.png,gregorian/2.png,gregorian/3.png,gregorian/4.png,gregorian/5.png

      - name: Send Jalali to Telegram
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            Daily Pentomino Puzzle Solutions (Jalali) (${{ steps.date.outputs.jtoday }})
          photo: jalali/1.png,jalali/2.png,jalali/3.png,jalali/4.png,jalali/5.png
